name: OreToggle
version: 2.0.0-beta
main: org.example.OreTogglePlugin
api-version: "1.21"
commands:
  toggleore:
    description: Enable or disable ore generation by removing matching ore blocks from chunks.
    usage: /toggleore <ore> <on|off>
    aliases: [oretoggle]
    permission: oretoggle.manage
  restoreore:
    description: Restore removed ore blocks from saved coordinates.
    usage: /restoreore <ore>
    permission: oretoggle.manage
permissions:
  oretoggle.manage:
    description: Allows managing ore toggles and restoration.
    default: op
